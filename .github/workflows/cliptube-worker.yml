name: Cliptube SI background worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliptube-background-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Cache Whisper model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ubuntu-latest-whisper-base-v1
      - name: Install worker dependencies
        run: pip install -r worker/requirements.txt
      - name: Process one queued task
        working-directory: worker
        env:
          SUPABASE_URL: https://pqlffdmwamyhfzfhdgcb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_TOKEN_ENCRYPTION_KEY }}
          WHISPER_MODEL: base
          RUN_ONCE: "1"
          HF_HOME: ~/.cache/huggingface
        run: python main.py
